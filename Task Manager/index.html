<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Lumina - Professional Task Manager</title>
  <link rel="icon" type="image/png" href="lumina.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Lumina</div>
      <div class="header-actions">
        <div class="user-info" id="userInfo"></div>
        <button class="btn btn-primary" onclick="app.showTaskModal()">+ New Task</button>
        <button class="btn btn-secondary" onclick="app.showProjectModal()">+ Project</button>
      </div>
    </header>

    <div class="stats-container" id="statsContainer">
      <div class="stat-card">
        <div class="stat-value" id="totalTasks">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="completedTasks">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="inProgressTasks">0</div>
        <div class="stat-label">In Progress</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="pendingTasks">0</div>
        <div class="stat-label">Pending</div>
      </div>
    </div>

    <div class="main-content">
      <aside class="sidebar">
        <div class="filter-group">
          <h3>Filters</h3>
          <button class="filter-btn active" data-filter="all">All Tasks</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="in-progress">In Progress</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <div class="filter-group">
          <h3>Priority</h3>
          <button class="filter-btn" data-filter="high">High Priority</button>
          <button class="filter-btn" data-filter="medium">Medium Priority</button>
          <button class="filter-btn" data-filter="low">Low Priority</button>
        </div>
        <div class="filter-group">
          <h3>Projects</h3>
          <div class="project-list" id="projectList"></div>
        </div>
      </aside>

      <main class="content-area">
        <div class="content-header">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search tasks...">
          </div>
        </div>
        <div class="tasks-grid" id="tasksGrid"></div>
      </main>
    </div>
  </div>

  <!-- Task Modal -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="taskModalTitle">Create New Task</h2>
        <button class="close-btn" onclick="app.closeModal('taskModal')">&times;</button>
      </div>
      <form id="taskForm">
        <div class="form-group">
          <label class="form-label">Task Title *</label>
          <input type="text" class="form-input" id="taskTitle" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="taskDescription"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Priority *</label>
            <select class="form-select" id="taskPriority" required>
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Status *</label>
            <select class="form-select" id="taskStatus" required>
              <option value="pending" selected>Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-input" id="taskDueDate">
          </div>
          <div class="form-group">
            <label class="form-label">Project</label>
            <select class="form-select" id="taskProject">
              <option value="">No Project</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="app.closeModal('taskModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Project Modal -->
  <div class="modal" id="projectModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Create New Project</h2>
        <button class="close-btn" onclick="app.closeModal('projectModal')">&times;</button>
      </div>
      <form id="projectForm">
        <div class="form-group">
          <label class="form-label">Project Name *</label>
          <input type="text" class="form-input" id="projectName" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="projectDescription"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="app.closeModal('projectModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
